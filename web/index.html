<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Senkai — a cross-platform task manager with authentication and cloud sync.">
  <meta name="theme-color" content="#111318">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Senkai">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Senkai</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body { margin: 0; background: #111318; }
    #boot {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: #111318; color: #c7c5d0; font-family: system-ui, sans-serif;
      transition: opacity .3s ease;
    }
    #boot .ring {
      width: 42px; height: 42px; border-radius: 50%;
      border: 3px solid #2a2b33; border-top-color: #818cf8;
      animation: spin 0.9s linear infinite;
    }
    #boot span { font-size: 15px; letter-spacing: .3px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="boot"><div class="ring"></div><span>Senkai</span></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var b = document.getElementById('boot');
      if (b) { b.style.opacity = '0'; setTimeout(function () { b.remove(); }, 300); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
